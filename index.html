<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        img-src 'self' https://www.google.com data:;
        style-src 'self' 'unsafe-inline';
        script-src 'self';
      "
    />
    <title>AiFlow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" aria-label="AI models">
        <div class="sidebar__header">
          <div class="brand">
            <div class="brand__dot" aria-hidden="true"></div>
            <div class="brand__text">
              <div class="brand__name">AiFlow</div>
              <div class="brand__sub">Models</div>
            </div>
          </div>
        </div>

        <nav class="sidebar__list" id="modelsList" aria-label="Saved models"></nav>

        <div class="sidebar__footer">
          <div class="footer__title">Add custom AI</div>
          <form id="addForm" class="add-form" autocomplete="off">
            <input
              id="urlInput"
              class="add-form__input"
              type="url"
              placeholder="https://example.com"
              required
            />
            <button class="add-form__btn" type="submit">Add</button>
          </form>
          <div class="hint" id="hintText">Click a model to open it on the right.</div>
        </div>
      </aside>

      <main class="content" aria-label="Webview area">
        <div class="content__empty" id="emptyState">
          <div class="empty__title">No model selected</div>
          <div class="empty__text">Select a model from the sidebar to start.</div>
        </div>
        <div class="webview-host" id="webviewHost" aria-label="Webview host"></div>
      </main>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
